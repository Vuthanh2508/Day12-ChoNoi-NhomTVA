<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  body.high-contrast { background:#000; color:#fff; }
  #accessibility { position:fixed; z-index:5; right:12px; bottom:44px; display:flex; flex-wrap:wrap; gap:6px; max-width:calc(100vw - 24px); color:#fff; font:18px system-ui,sans-serif; }
  #accessibility button { font:inherit; color:inherit; background:#111; border:2px solid currentColor; padding:6px 10px; }
  #subtitle { position:fixed; z-index:5; bottom:96px; left:50%; transform:translateX(-50%); max-width:90vw; padding:6px 12px; background:#000; color:#fff; font:18px system-ui,sans-serif; }
  #subtitle:empty { padding:0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="accessibility" aria-label="Cài đặt tiếp cận">
  <button id="contrastToggle" type="button" aria-pressed="false">Tương phản cao (H)</button>
  <button id="muteToggle" type="button" aria-pressed="false">Tắt tiếng (M)</button>
</div>
<div id="subtitle" role="status" aria-live="polite"></div>
<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó). Hình khối tạm, thay bằng đồ họa của nhóm.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false, plan = null; // plan = kế hoạch Má Tư (event day_plan, P2)
// P2 vòng ngày: menu/pause/shop + cache sự kiện (render phòng thủ, sim v1.1 chưa có thì ẩn)
let menuOpen = true, pauseActive = false, legacyServer = false, exitNote = false;
let pendingPause = false, pendingBuy = null, pendingShopDone = false;
let intro = null, introStart = 0, lastInventory = null, quanEnd = null, dayStats = null, seenEvt = {};
// Sáng tạo: thoại giọng Nam Bộ theo event + SFX WebAudio (chỉ tầng hiển thị, headless không đụng)
let actx = null, lastSndTick = -1, subtitleTimer;
const subtitle = document.getElementById("subtitle");
function readPreference(key) {
  try { return localStorage.getItem(key) === "true"; } catch { return false; }
}
function savePreference(key, value) {
  try { localStorage.setItem(key, String(value)); } catch { /* tùy chọn vẫn dùng được trong phiên này */ }
}
let highContrast = readPreference("chonoi.highContrast");
let muted = readPreference("chonoi.muted");
document.body.classList.toggle("high-contrast", highContrast);
function updateContrastButton() {
  const button = document.getElementById("contrastToggle");
  button.setAttribute("aria-pressed", String(highContrast));
  button.textContent = "Tương phản cao: " + (highContrast ? "Bật" : "Tắt") + " (H)";
}
updateContrastButton();
function toggleContrast() {
  highContrast = !highContrast;
  savePreference("chonoi.highContrast", highContrast);
  document.body.classList.toggle("high-contrast", highContrast);
  updateContrastButton();
}
const muteButton = document.getElementById("muteToggle");
function updateMuteButton() {
  muteButton.setAttribute("aria-pressed", String(muted));
  muteButton.textContent = muted ? "Đang tắt tiếng (M)" : "Tắt tiếng (M)";
}
function toggleMute() {
  muted = !muted;
  savePreference("chonoi.muted", muted);
  updateMuteButton();
}
updateMuteButton();
document.getElementById("contrastToggle").addEventListener("click", toggleContrast);
muteButton.addEventListener("click", toggleMute);

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap?.phase || snap?.mode || "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  const o = { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
  if (!legacyServer) { // trường v1.1: chỉ gửi khi server nhận (400 thì tắt hẳn)
    if (pendingPause) o.pause = true;
    if (pendingShopDone) o.shop_done = true;
    if (pendingBuy) o.buy = pendingBuy;
  }
  return o;
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try {
      const r = await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } });
      if (!r.ok) legacyServer = true; // server từ chối trường mới → ngừng gửi pause/buy/shop_done
      pendingPause = pendingShopDone = false; pendingBuy = null; // nút cạnh lên: gửi 1 lần
    }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  if (e.target instanceof HTMLButtonElement && (e.key === "Enter" || e.key === " ")) return;
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) { /* không có audio */ } }
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  else if (k === "h") toggleContrast();
  else if (k === "m") toggleMute();
  else if (k === "escape" || k === "p") { pauseActive = !pauseActive; pendingPause = true; }
  else if (menuOpen && !exitNote && k === "enter") { menuOpen = false; fetch("/restart", { method: "POST" }); lastSent = ""; }
  else if (menuOpen && k === "q") exitNote = true;
  else if (menuOpen && exitNote) exitNote = false;
  else if (snap && snap.phase === "shop") {
    if (k === "1") pendingBuy = "oxygen";
    else if (k === "2") pendingBuy = "hp";
    else if (k === "enter") pendingShopDone = true;
  }
  if (intro && intro.kind !== "result" && !e.repeat) intro = null; // nhấn phím bỏ qua intro
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    const previousTick = snap?.tick;
    snap = await r.json();
    if (previousTick !== undefined && snap.tick < previousTick) {
      lastSndTick = -1;
      clearTimeout(subtitleTimer);
      subtitle.textContent = "";
    }
    offline = false;
    const captions = [];
    (snap.events || []).forEach((e) => {
      if (e.name === "day_plan") plan = e.data; // P2: cache kế hoạch
      else if (e.name === "day_start" && e.tick > (seenEvt.day_start || -1)) { seenEvt.day_start = e.tick; intro = { kind: "day" }; introStart = snap.tick; dayStats = { served: 0, leftPatience: 0, leftClosing: 0 }; }
      else if (e.name === "gather_end") lastInventory = (e.data.inventory && e.data.inventory.items) || null;
      else if (e.name === "phase_start" && snap.phase === "quan" && e.tick > (seenEvt.quan || -1)) { seenEvt.quan = e.tick; intro = { kind: "evening" }; introStart = snap.tick; dayStats = dayStats || { served: 0, leftPatience: 0, leftClosing: 0 }; }
      else if (e.name === "served" && dayStats) dayStats.served++;
      else if (e.name === "customer_left" && dayStats) { if (e.data.reason === "closing") dayStats.leftClosing++; else dayStats.leftPatience++; }
      else if (e.name === "quan_end" && e.tick > (seenEvt.quan_end || -1)) { seenEvt.quan_end = e.tick; quanEnd = e.data; intro = { kind: "result" }; introStart = snap.tick; }
      const tk = talkOf(e);
      if (tk && e.tick > lastSndTick) captions.push(tk);
      if (SFX[e.name] && e.tick > lastSndTick) SFX[e.name]();
    });
    const mx = (snap.events || []).reduce((m, e) => Math.max(m, e.tick), -1);
    lastSndTick = Math.max(lastSndTick, mx);
    if (captions.length) {
      clearTimeout(subtitleTimer);
      subtitle.textContent = captions.slice(-3).join(" · ");
      subtitleTimer = setTimeout(() => { subtitle.textContent = ""; }, 3500);
    }
    if (snap.tick < 10) { plan = null; intro = null; lastInventory = null; quanEnd = null; dayStats = null; seenEvt = {}; }
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";

// ----- đồ họa theo loại (vector — nhóm vẽ). Cá vẽ quanh gốc, đầu hướng +x; caller tự translate/rotate -----
const KINDS_ORDER = ["ca_loc", "ca_linh", "ca_keo", "bong_dien_dien", "bong_sung", "keo_neo"];
const OXY_LOW_FRAC = 0.25, BASKET_NEAR_FRAC = 0.75; // ngưỡng chỉ để vẽ HUD, không phải luật

function drawCaLoc(s, wag = 0) { // cá lóc: thân dài sẫm olive, mõm nhọn, vằn sọc
  ctx.fillStyle = "#4f633d";
  ctx.beginPath();
  ctx.moveTo(1.15 * s, 0);
  ctx.quadraticCurveTo(0.6 * s, -0.32 * s, -0.55 * s, -0.24 * s);
  ctx.quadraticCurveTo(-0.9 * s, -0.14 * s, -0.9 * s, 0);
  ctx.quadraticCurveTo(-0.9 * s, 0.14 * s, -0.55 * s, 0.24 * s);
  ctx.quadraticCurveTo(0.6 * s, 0.32 * s, 1.15 * s, 0);
  ctx.fill();
  ctx.beginPath(); ctx.moveTo(0.45 * s, -0.2 * s); ctx.lineTo(0, -0.52 * s); ctx.lineTo(-0.5 * s, -0.26 * s); ctx.fill(); // vây lưng
  ctx.beginPath(); ctx.moveTo(-0.75 * s, 0); ctx.lineTo(-1.4 * s, -0.3 * s + wag * 0.12 * s); ctx.lineTo(-1.22 * s, 0); ctx.lineTo(-1.4 * s, 0.3 * s + wag * 0.12 * s); ctx.fill(); // đuôi vẫy
  ctx.fillStyle = "rgba(24,32,16,.75)"; // vằn sọc
  for (let i = -0.4; i <= 0.5; i += 0.45) { ctx.beginPath(); ctx.ellipse(i * s, 0, 0.06 * s, 0.2 * s, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = "rgba(214,230,242,.3)"; // bụng sáng
  ctx.beginPath(); ctx.ellipse(0.15 * s, 0.14 * s, 0.5 * s, 0.09 * s, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#10161c"; // mắt
  ctx.beginPath(); ctx.arc(0.82 * s, -0.07 * s, 0.07 * s, 0, Math.PI * 2); ctx.fill();
}
function drawCaLinh(s, wag = 0) { // cá linh: tròn nhỏ bạc, đuôi chẻ, mắt to
  ctx.fillStyle = kc("ca_linh");
  ctx.beginPath(); ctx.ellipse(0.1 * s, 0, 0.55 * s, 0.34 * s, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#8fa8b8"; // lưng sẫm
  ctx.beginPath(); ctx.ellipse(0, -0.12 * s, 0.45 * s, 0.15 * s, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-0.3 * s, 0); ctx.lineTo(-0.85 * s, -0.28 * s + wag * 0.1 * s); ctx.lineTo(-0.62 * s, 0); ctx.lineTo(-0.85 * s, 0.28 * s + wag * 0.1 * s); ctx.fill(); // đuôi chẻ vẫy
  ctx.fillStyle = "rgba(255,255,255,.85)"; // bóng sáng
  ctx.beginPath(); ctx.arc(0.22 * s, -0.1 * s, 0.07 * s, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#22303a"; // mắt
  ctx.beginPath(); ctx.arc(0.45 * s, -0.02 * s, 0.09 * s, 0, Math.PI * 2); ctx.fill();
}
function drawCaKeo(s) { // cá kèo: dẹt rộng, sọc dọc nâu (P2)
  ctx.fillStyle = kc("ca_keo");
  ctx.beginPath(); ctx.ellipse(0.05 * s, 0, 0.62 * s, 0.42 * s, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(60,40,20,.6)";
  [-0.25, 0.05, 0.35].forEach((sx2) => { ctx.beginPath(); ctx.ellipse(sx2 * s, 0, 0.05 * s, 0.3 * s, 0, 0, Math.PI * 2); ctx.fill(); });
  ctx.fillStyle = kc("ca_keo");
  ctx.beginPath(); ctx.moveTo(-0.4 * s, 0); ctx.lineTo(-0.8 * s, -0.3 * s); ctx.lineTo(-0.8 * s, 0.3 * s); ctx.fill();
  ctx.fillStyle = "#1e1a17"; ctx.beginPath(); ctx.arc(0.4 * s, -0.1 * s, 0.06 * s, 0, Math.PI * 2); ctx.fill();
}
function drawFishKind(kind, s, wag = 0) {
  if (kind === "ca_loc") drawCaLoc(s, wag);
  else if (kind === "ca_linh") drawCaLinh(s, wag);
  else if (kind === "ca_keo") drawCaKeo(s);
  else { // kind lạ: ellipse + đuôi như starter
    ctx.fillStyle = kc(kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
  }
}
function drawBongDienDien(s) { // chùm 3 cầu vàng trên cuống xanh
  ctx.strokeStyle = "#5d8a4a"; ctx.lineWidth = 0.1 * s;
  ctx.beginPath(); ctx.moveTo(0, 0.45 * s); ctx.lineTo(0, 0.02 * s); ctx.stroke();
  ctx.fillStyle = kc("bong_dien_dien");
  [[-0.34, -0.16, 0.26], [0.06, -0.38, 0.3], [0.38, -0.1, 0.24]].forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(x * s, y * s, r * s, 0, Math.PI * 2); ctx.fill(); });
  ctx.fillStyle = "rgba(140,100,10,.55)"; // hạt trên cầu hoa
  [[-0.34, -0.16], [0.06, -0.38], [0.38, -0.1]].forEach(([x, y]) => {
    for (let a = 0; a < 6; a++) { ctx.beginPath(); ctx.arc((x + Math.cos(a * 1.05) * 0.12) * s, (y + Math.sin(a * 1.05) * 0.12) * s, 0.035 * s, 0, Math.PI * 2); ctx.fill(); }
  });
}
function drawBongSung(s) { // bông súng: 6 cánh hồng xòe + nhụy + lá nổi
  ctx.fillStyle = "#3f6e44"; // lá
  ctx.beginPath(); ctx.ellipse(0.45 * s, 0.4 * s, 0.42 * s, 0.13 * s, 0.25, 0, Math.PI * 2); ctx.fill();
  for (let i = 0; i < 6; i++) {
    ctx.save(); ctx.rotate((i / 6) * Math.PI * 2);
    ctx.fillStyle = kc("bong_sung");
    ctx.beginPath(); ctx.ellipse(0, -0.26 * s, 0.12 * s, 0.3 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = "#f7e8a0"; // nhụy
  ctx.beginPath(); ctx.arc(0, 0, 0.14 * s, 0, Math.PI * 2); ctx.fill();
}
function drawKeoNeo(s) { // kèo nèo: chùm hoa trên cọng cong (P2)
  ctx.strokeStyle = "#5d8a4a"; ctx.lineWidth = 0.09 * s;
  ctx.beginPath(); ctx.moveTo(0, 0.45 * s); ctx.quadraticCurveTo(-0.1 * s, 0.1 * s, 0, -0.15 * s); ctx.stroke();
  for (let i = 0; i < 4; i++) {
    const a2 = -0.5 + i * 0.42;
    ctx.fillStyle = kc("keo_neo");
    ctx.beginPath(); ctx.ellipse(Math.sin(a2) * 0.28 * s, -0.3 * s + Math.cos(a2) * 0.22 * s, 0.14 * s, 0.09 * s, a2, 0, Math.PI * 2); ctx.fill();
  }
}
function drawNodeKind(kind, s, x, y) { // hoa quanh điểm neo (x, y) trên mặt nước
  ctx.save(); ctx.translate(x, y);
  if (kind === "bong_dien_dien") drawBongDienDien(s);
  else if (kind === "bong_sung") drawBongSung(s);
  else if (kind === "keo_neo") drawKeoNeo(s);
  else { ctx.fillStyle = kc(kind); ctx.beginPath(); ctx.ellipse(0, -0.1 * s, 0.9 * s, 0.4 * s, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}
function drawMiniIcon(kind, x, y, sz) { // hình thu nhỏ theo loại, dùng cho giỏ / kho
  ctx.save(); ctx.translate(x, y);
  const u = (kind === "bong_dien_dien" || kind === "bong_sung" || kind === "keo_neo") ? sz / 1.5 : sz / 3.2;
  ctx.scale(u, u);
  if (kind === "bong_dien_dien" || kind === "bong_sung" || kind === "keo_neo") drawNodeKind(kind, 1, 0, 0);
  else drawFishKind(kind, 1);
  ctx.restore();
}

// ----- đề tài miền Tây (PRD-0 mục 3): palette + nhân vật + cảnh phụ trợ. Chỉ tầng hiển thị -----
const THM = {
  sky1: "#ffd9d0", sky2: "#ffb4a2",       // ánh hồng buổi sớm
  water1: "#71805a", water2: "#15251f",   // nước phù sa
  bank: "#4a3b28", trunk: "#5d4a33", leaf: "#3f6e44",
  floorNight: "#7a5a36", waterNight: "#16324a"
};
const hashId = (id) => [...String(id)].reduce((a, c) => a + c.charCodeAt(0), 0);

function drawPalm(x, baseY, s, lean) { // dừa nước: thân cong + lá trên bờ
  ctx.strokeStyle = THM.trunk; ctx.lineWidth = 0.16 * s;
  ctx.beginPath(); ctx.moveTo(x, baseY);
  ctx.quadraticCurveTo(x + lean * 1.6 * s, baseY - 2.2 * s, x + lean * 2.6 * s, baseY - 4.2 * s);
  ctx.stroke();
  const tx = x + lean * 2.6 * s, ty = baseY - 4.2 * s;
  ctx.strokeStyle = THM.leaf; ctx.lineWidth = 0.12 * s;
  for (let i = 0; i < 5; i++) {
    const ang = -2.4 + i * 1.2;
    ctx.beginPath(); ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo(tx + Math.cos(ang) * 1.3 * s, ty + Math.sin(ang) * 1.0 * s - 0.3 * s, tx + Math.cos(ang) * 2.1 * s, ty + Math.sin(ang) * 1.4 * s + 0.25 * s);
    ctx.stroke();
  }
  ctx.fillStyle = "#6b4f3a";
  ctx.beginPath(); ctx.arc(tx - 0.1 * s, ty + 0.15 * s, 0.12 * s, 0, Math.PI * 2); ctx.fill();
}
function drawUtSen(px, py, s, o) { // Út Sen: áo bà ba, khăn rằn, kính lặn khi lặn, giỏ lưới (gather)
  const a = ((o.heading || 0) * Math.PI) / 180;
  ctx.save(); ctx.translate(px, py);
  ctx.fillStyle = "#232a36"; // thân áo bà ba
  ctx.beginPath(); ctx.ellipse(0, 0.05 * s, 0.5 * s, 0.6 * s, 0, 0, Math.PI * 2); ctx.fill();
  const kb = 0.36 * s; // khăn rằn 2×2 ô
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    ctx.fillStyle = (i + j) % 2 ? "#6b4f3a" : "#d9c9a8";
    ctx.fillRect(-kb / 2 + (i * kb) / 2, -0.74 * s + (j * kb) / 2, kb / 2, kb / 2);
  }
  ctx.fillStyle = "#e8b48a"; // đầu
  ctx.beginPath(); ctx.arc(0, -0.85 * s, 0.34 * s, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#151a20"; // tóc
  ctx.beginPath(); ctx.arc(0, -0.95 * s, 0.32 * s, Math.PI * 0.95, Math.PI * 2.05); ctx.fill();
  if (o.underwater) { // kính lặn tự chế
    ctx.strokeStyle = "#d9e2ea"; ctx.lineWidth = 0.08 * s;
    ctx.beginPath(); ctx.moveTo(-0.3 * s, -0.88 * s); ctx.lineTo(0.3 * s, -0.88 * s); ctx.stroke();
    ctx.fillStyle = "rgba(180,220,255,.55)"; ctx.beginPath(); ctx.arc(0.12 * s, -0.85 * s, 0.12 * s, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#2a3138"; ctx.lineWidth = 0.04 * s; ctx.beginPath(); ctx.arc(0.12 * s, -0.85 * s, 0.12 * s, 0, Math.PI * 2); ctx.stroke();
  } else {
    ctx.fillStyle = "#1e1a17"; ctx.beginPath(); ctx.arc(0.1 * s, -0.85 * s, 0.045 * s, 0, Math.PI * 2); ctx.fill();
  }

}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----

  ctx.strokeStyle = "#4a3b28"; ctx.lineWidth = 5; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);

  for (let i = 1; i < 8; i++) {

    let label = STOVE_STATE_LABEL[state];

      const ing = (plan && plan.ingredients) ? Object.keys(plan.ingredients) : [];
      if (ing.length) text("Cần lấy: " + ing.map((k) => (KIND_NAME[k] || k) + " ×" + plan.ingredients[k]).join(" · "), w / 2, h / 2 + 76, { size: 18, align: "center", color: "#cfd8dc" });
      text("Vào sau " + Math.max(0, Math.ceil((240 - age) / 60)) + "s — nhấn phím để vào ngay", w / 2, h / 2 + 106, { size: 18, align: "center", color: "#9fb3c0" });
      if (age > 240) intro = null;
    } else if (intro.kind === "evening") {
      panel(w / 2 - 330, h / 2 - 130, 660, 240, "rgba(4,10,16,.82)");
      text("BUỔI TỐI — MỞ QUÁN", w / 2, h / 2 - 86, { size: 28, align: "center", color: "#ffd9c4" });
      const inventoryCounts = counts(lastInventory), items = Object.keys(inventoryCounts);
      text("Nhập kho: " + (items.length ? items.map((k) => (KIND_NAME[k] || k) + " ×" + inventoryCounts[k]).join(" · ") : "(không có gì)"), w / 2, h / 2 - 40, { size: 18, align: "center" });
      const menu = snap.meta && snap.meta.menu;
      if (menu) {
        const cookable = Object.keys(menu).filter((d) => Object.keys(menu[d].recipe || {}).every((k) => (inventoryCounts[k] || 0) >= menu[d].recipe[k]));
        text("Nấu được: " + (cookable.length ? cookable.map(dn).join(" · ") : "(chưa đủ món nào)"), w / 2, h / 2, { size: 18, align: "center", color: "#cfd8dc" });
      }
      text("Khách sẽ vào quán — phục vụ trước khi hết kiên nhẫn!", w / 2, h / 2 + 40, { size: 18, align: "center", color: "#cfd8dc" });
      text("Vào sau " + Math.max(0, Math.ceil((240 - age) / 60)) + "s — nhấn phím để vào ngay", w / 2, h / 2 + 80, { size: 18, align: "center", color: "#9fb3c0" });
      if (age > 240) intro = null;
    } else if (intro.kind === "result" && quanEnd) {
      panel(w / 2 - 330, h / 2 - 120, 660, 220, "rgba(4,10,16,.82)");
      text("KẾT QUẢ CA TỐI", w / 2, h / 2 - 78, { size: 28, align: "center", color: "#ffd9c4" });
      text(`Khách phục vụ: ${dayStats ? dayStats.served : 0} · Bỏ đi (hết kiên nhẫn): ${dayStats ? dayStats.leftPatience : 0}`, w / 2, h / 2 - 34, { size: 18, align: "center" });
      text(`Tiền ca: +${quanEnd.shift_earned ?? 0}k · Tổng: ${quanEnd.money ?? 0}k`, w / 2, h / 2 + 4, { size: 18, align: "center" });
      text(`Uy tín: ${(quanEnd.reputation ?? 0).toFixed(1)}`, w / 2, h / 2 + 42, { size: 18, align: "center", color: "#cfd8dc" });
      text("Nhấn phím để sang Chợ (Shop)…", w / 2, h / 2 + 82, { size: 18, align: "center", color: "#9fb3c0" });
      if (age > 360 || snap.phase === "shop") intro = null;
    }
  }
  if (pauseActive && snap && !snap.finished) {
    ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(0, 0, w, h);
    panel(w / 2 - 240, h / 2 - 96, 480, 180);
    text("TẠM DỪNG", w / 2, h / 2 - 44, { size: 26, align: "center" });
    text("Esc/P — tiếp tục", w / 2, h / 2, { size: 18, align: "center", color: "#cfd8dc" });
    text(legacyServer ? "(máy chủ hiện tại chưa nhận pause — đồng hồ vẫn chạy)" : "Đã báo máy chủ tạm dừng", w / 2, h / 2 + 40, { size: 18, align: "center", color: "#9fb3c0" });
  }
  if (snap && snap.finished && snap.reason === "days_complete") {
    ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, w, h);
    panel(w / 2 - 300, h / 2 - 110, 600, 210);
    text("TỔNG KẾT CHỢ NỔI!", w / 2, h / 2 - 66, { size: 30, align: "center", color: "#ffd9c4" });
    text(`Tổng tiền: ${snap.money ?? 0}k · Tổng điểm: ${snap.score ?? 0}`, w / 2, h / 2 - 20, { size: 20, align: "center" });
    text(`Uy tín: ${(snap.reputation ?? 0).toFixed(1)}/5`, w / 2, h / 2 + 20, { size: 20, align: "center" });
    text("R — chơi lại từ Ngày 1", w / 2, h / 2 + 66, { size: 18, align: "center", color: "#9fb3c0" });
  }
}

function drawPhase34(w, h) {
  const p = snap.player || {}, warnings = [];
  const phase = snap.phase || snap.mode;
  const meta = snap.meta || {};
  if (phase === "gather") {
    if (p.oxygen_max_ticks && p.oxygen_ticks < p.oxygen_max_ticks * OXY_LOW_FRAC) {
      warnings.push(p.oxygen_ticks === 0 ? "⚠ HẾT OXY" : "⚠ OXY SẮP HẾT");
    }
    const species = meta.monsters?.species;
    if (p.pos && (snap.monsters || []).some((m) => {
      const radius = species?.[m.kind]?.detect_radius ?? 10;
      return m.pos && Math.hypot(p.pos[0] - m.pos[0], p.pos[1] - m.pos[1]) <= radius;
    })) warnings.push("⚠ THỦY QUÁI Ở GẦN");
    if (snap.current) warnings.push(`Dòng lũ ${snap.current.direction > 0 ? "→" : "←"} · ${Math.ceil(snap.current.ticks_left / 60)}s`);
  }
  if (phase === "quan") {
    const maxPatience = ((snap.meta || {}).patience_s || 60) * 60;
    (snap.customers || []).filter((c) => c.state === "waiting" && c.patience_ticks_left < maxPatience * 0.25).forEach((c) => warnings.push(`⚠ KHÁCH ${c.table_id} SẮP GIẬN`));
  }
  if (warnings.length) { panel(12, 75, Math.min(w - 24, 440), warnings.length * 28 + 12, "rgba(0,0,0,.85)"); warnings.forEach((msg, i) => text(msg, 22, 99 + i * 28)); }
  const reservations = Array.isArray(snap.reservations) ? snap.reservations : [];
  if (reservations.length) {
    panel(w - 360, 90, 348, reservations.length * 30 + 38, "rgba(0,0,0,.85)");
    text("Đơn đặt trước", w - 350, 115);
    reservations.forEach((r, i) => text(`${r.id} · ${r.table_id} · ${dn(r.dish_id)} · ${r.state || "scheduled"} · ${fmtTime(r.arrival_tick || 0)}`, w - 350, 145 + i * 30, { size: 18 }));
  }
  const items = phase === "gather" ? snap.hold : snap.stock;
  if (Array.isArray(items) && items.some((it) => itemFresh(it) !== null)) {
    const rows = items.map((it) => `${it.id || ""} ${KIND_NAME[itemKind(it)] || itemKind(it)} ${itemFresh(it) === null ? "" : itemFresh(it).toFixed(1) + "%" + (itemFresh(it) < 30 ? " ƯƠN" : "")}`);
    const height = 32 + rows.length * 22;
    panel(12, Math.max(140, h - height - 80), 280, height, "rgba(0,0,0,.88)");
    text("Độ tươi nguyên liệu", 20, Math.max(140, h - height - 80) + 22);
    rows.forEach((row, i) => text(row, 20, Math.max(140, h - height - 80) + 44 + i * 22));
  }
}

// ----- Benchmark (TICKET-04): /?bench=1&duration=30&warmup=3 — đo từng khung bằng rAF, gửi về /bench -----
const BENCH = (() => {
  const q = new URLSearchParams(location.search);
  return q.has("bench") ? { dur: +q.get("duration") || 30, warm: +q.get("warmup") || 3, t0: null, prev: null, deltas: [], done: false } : null;
})();
if (BENCH) menuOpen = false;
function benchSend(o) { try { fetch("/bench", { method: "POST", body: JSON.stringify(o), headers: { "Content-Type": "application/json" } }); } catch (e) { /* bỏ qua */ } }
function benchTick(now) {
  if (!BENCH || BENCH.done || !snap) return;
  if (BENCH.t0 === null) { BENCH.t0 = now; benchSend({ event: "first_frame" }); return; }
  const el = (now - BENCH.t0) / 1000;
  if (el < BENCH.warm) { BENCH.prev = now; return; }
  if (BENCH.prev !== null) BENCH.deltas.push(now - BENCH.prev);
  BENCH.prev = now;
  if (el >= BENCH.warm + BENCH.dur) { BENCH.done = true; benchSend({ event: "done", deltas: BENCH.deltas }); }
}

function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  benchTick(performance.now());
  const [w, h] = fit();
  ctx.fillStyle = highContrast ? "#000" : "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    if (snap.phase === "shop") drawShop(w, h); else if (snap.phase === "quan" || snap.mode === "quan") drawQuan(w, h); else drawGather(w, h);
    drawPhase34(w, h);
    eventLog(w, h);
    overlay(w, h);
    screens(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
