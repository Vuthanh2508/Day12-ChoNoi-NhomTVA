          const ing = (plan && plan.ingredients) ? Object.keys(plan.ingredients) : [];
          if (ing.length) text("Cần lấy: " + ing.map((k) => (KIND_NAME[k] || k) + " ×" + plan.ingredients[k]).join(" · "), w / 2, h / 2 + 86, { size: 18, align: "center", color: "#a5f0b2" });
          text("Vào sau " + Math.max(0, Math.ceil((240 - age) / 60)) + "s — nhấn phím bất kỳ để vào ngay", w / 2, h / 2 + 128, { size: 18, align: "center", color: "#9fb3c0" });
          if (age > 240) intro = null;
        } else if (intro.kind === "evening") {
          ctx.fillStyle = "rgba(4, 10, 18, 0.45)"; ctx.fillRect(0, 0, w, h);
          panel(w / 2 - 360, h / 2 - 150, 720, 300, "rgba(10, 22, 34, 0.94)", "rgba(255, 193, 7, 0.65)");
          text("🏮 BUỔI TỐI — MỞ QUÁN", w / 2, h / 2 - 102, { size: 28, align: "center", bold: true, color: "#ffe082" });
          const inventoryCounts = counts(lastInventory), items = Object.keys(inventoryCounts);
          text("Nhập kho: " + (items.length ? items.map((k) => (KIND_NAME[k] || k) + " ×" + inventoryCounts[k]).join(" · ") : "(không có gì)"), w / 2, h / 2 - 50, { size: 18, align: "center", color: "#fff" });
          const menu = snap.meta && snap.meta.menu;
          if (menu) {
            const cookable = Object.keys(menu).filter((d) => Object.keys(menu[d].recipe || {}).every((k) => (inventoryCounts[k] || 0) >= menu[d].recipe[k]));
            text("Nấu được: " + (cookable.length ? cookable.map(dn).join(" · ") : "(chưa đủ món nào)"), w / 2, h / 2 - 6, { size: 18, align: "center", color: "#a5f0b2" });
          }
          text("Khách sẽ vào quán — phục vụ trước khi hết kiên nhẫn!", w / 2, h / 2 + 44, { size: 18, align: "center", color: "#ffd9c4" });
          text("Vào sau " + Math.max(0, Math.ceil((240 - age) / 60)) + "s — nhấn phím bất kỳ để vào ngay", w / 2, h / 2 + 96, { size: 18, align: "center", color: "#9fb3c0" });
          if (age > 240) intro = null;
        } else if (intro.kind === "result" && quanEnd) {
          ctx.fillStyle = "rgba(4, 10, 18, 0.72)"; ctx.fillRect(0, 0, w, h);
          panel(w / 2 - 380, h / 2 - 180, 760, 360, "rgba(10, 22, 36, 0.96)", "rgba(255, 213, 79, 0.85)");

          // Thanh trang trí trên đỉnh
          const dg = ctx.createLinearGradient(w / 2 - 250, 0, w / 2 + 250, 0);
          dg.addColorStop(0, "rgba(255, 213, 79, 0)");
          dg.addColorStop(0.5, "rgba(255, 213, 79, 0.9)");
          dg.addColorStop(1, "rgba(255, 213, 79, 0)");
          ctx.fillStyle = dg;
          ctx.fillRect(w / 2 - 250, h / 2 - 110, 500, 2);

          text("🏮 KẾT THÚC NGÀY " + (snap.day || "1") + " — TỔNG KẾT CA 🏮", w / 2, h / 2 - 135, { size: 28, align: "center", bold: true, color: "#ffe082" });
          text("Ca phục vụ đã kết thúc xuất sắc! Báo cáo thành tích hôm nay:", w / 2, h / 2 - 82, { size: 18, align: "center", color: "#f3ece1" });

          // Khung thống kê chỉ số
          panel(w / 2 - 340, h / 2 - 58, 680, 136, "rgba(18, 32, 48, 0.88)", "rgba(255, 214, 153, 0.35)");
          text(`🍲 Món đã phục vụ: ${dayStats ? dayStats.served : 0} món · ⏳ Khách bỏ về: ${dayStats ? dayStats.leftPatience : 0}`, w / 2 - 310, h / 2 - 24, { size: 18, color: "#dce6ee" });
          text(`💵 Doanh thu hôm nay: +${quanEnd.shift_earned ?? 0}k xu · 💰 Tổng quỹ tích lũy: ${quanEnd.money ?? 0}k xu`, w / 2 - 310, h / 2 + 12, { size: 20, bold: true, color: "#69f0ae" });
          text(`⭐ Danh tiếng quán: ${(quanEnd.reputation ?? 0).toFixed(1)}/5.0 · 🏆 Điểm số: ${snap.score ?? 0}`, w / 2 - 310, h / 2 + 48, { size: 18, color: "#ffd54f" });

          // Nút bấm & hướng dẫn
          drawKeyBadge(w / 2 - 120, h / 2 + 112, "Enter", "#69f0ae");
          text("Ghé Chợ Má Tư (Shop)", w / 2 - 60, h / 2 + 113, { size: 20, base: "middle", bold: true, color: "#fff" });
          text("Nhấn [Enter] hoặc [Phím cách] để tiếp tục", w / 2, h / 2 + 154, { size: 16, align: "center", color: "#9fb3c0" });

          if (age > 1800) intro = null;
        }
      }
      if (pauseActive && snap && !snap.finished) {
        ctx.fillStyle = "rgba(4, 10, 18, 0.56)"; ctx.fillRect(0, 0, w, h);
        panel(w / 2 - 270, h / 2 - 104, 540, 208, "rgba(11, 22, 34, 0.95)", "rgba(255, 213, 79, 0.58)");
        text("⏸ TẠM DỪNG", w / 2, h / 2 - 48, { size: 28, align: "center", bold: true, color: "#ffe082" });
        text("Esc / P — tiếp tục chơi", w / 2, h / 2 + 4, { size: 20, align: "center", color: "#f3ece1" });
        text(legacyServer ? "(máy chủ hiện tại chưa nhận pause — đồng hồ vẫn chạy)" : "Đã báo máy chủ tạm dừng", w / 2, h / 2 + 54, { size: 18, align: "center", color: "#9fb3c0" });
      }
      if (snap && snap.finished && snap.reason === "days_complete") {
        ctx.fillStyle = "rgba(4, 10, 18, 0.68)"; ctx.fillRect(0, 0, w, h);
        panel(w / 2 - 320, h / 2 - 130, 640, 260, "rgba(11, 22, 34, 0.96)", "rgba(255, 213, 79, 0.78)");
        text("🎉 TỔNG KẾT CHỢ NỔI! 🎉", w / 2, h / 2 - 76, { size: 30, align: "center", bold: true, color: "#ffe082" });
        text(`💰 Tổng tiền: ${snap.money ?? 0}k · 🏆 Tổng điểm: ${snap.score ?? 0}`, w / 2, h / 2 - 18, { size: 21, align: "center", bold: true, color: "#69f0ae" });
        text(`⭐ Uy tín: ${(snap.reputation ?? 0).toFixed(1)}/5`, w / 2, h / 2 + 28, { size: 20, align: "center", color: "#ffd54f" });
        text("Nhấn R — chơi lại từ Ngày 1", w / 2, h / 2 + 84, { size: 18, align: "center", color: "#b6c7d4" });
      }
    }

    function drawPhase34(w, h) {
      const p = snap.player || {}, warnings = [];
      const phase = snap.phase || snap.mode;
      const meta = snap.meta || {};
      if (phase === "gather") {
        if (p.oxygen_max_ticks && p.oxygen_ticks < p.oxygen_max_ticks * OXY_LOW_FRAC) {
          warnings.push(p.oxygen_ticks === 0 ? "⚠ HẾT OXY" : "⚠ OXY SẮP HẾT");
        }
        const species = meta.monsters?.species;
        if (p.pos && (snap.monsters || []).some((m) => {
          const radius = species?.[m.kind]?.detect_radius ?? 10;
          return m.pos && Math.hypot(p.pos[0] - m.pos[0], p.pos[1] - m.pos[1]) <= radius;
        })) warnings.push("⚠ THỦY QUÁI Ở GẦN");
        if (snap.current) warnings.push(`🌊 Dòng lũ ${snap.current.direction > 0 ? "→" : "←"} · ${Math.ceil(snap.current.ticks_left / 60)}s`);
      }
      if (phase === "quan") {
        if (snap.closing_soon) {
          const sec = Math.max(0, Math.ceil((snap.time_left_ticks ?? 600) / 60));
          warnings.push(`🎉 HẾT KHÁCH! ĐÓNG CA SAU ${sec}s`);
        }
        const maxPatience = ((snap.meta || {}).patience_s || 60) * 60;
        (snap.customers || []).filter((c) => c.state === "waiting" && c.patience_ticks_left < maxPatience * 0.25).forEach((c) => warnings.push(`⚠ KHÁCH ${c.table_id} SẮP GIẬN`));
      }
      if (down.has("sprint") || shiftDown) {
        panel(w - 200, 24, 180, 36, "rgba(24, 76, 36, 0.92)", "#69f0ae");
        text("⚡ TĂNG TỐC (SHIFT)", w - 110, 42, { align: "center", base: "middle", size: 16, bold: true, color: "#e8f5e9" });
      }
      if (warnings.length) {
        panel(12, 82, Math.min(w - 24, 440), warnings.length * 32 + 16, "rgba(92, 16, 24, 0.88)", "rgba(255, 138, 128, 0.7)");
        warnings.forEach((msg, i) => text(msg, 24, 108 + i * 32, { size: 18, bold: true, color: "#ffe0e0" }));
      }
      const reservations = Array.isArray(snap.reservations) ? snap.reservations : [];
      if (reservations.length) {
        panel(w - 420, 82, 408, reservations.length * 32 + 44, "rgba(10, 22, 34, 0.9)", "rgba(255, 213, 79, 0.45)");
        text("📋 Đơn đặt trước", w - 406, 110, { size: 19, bold: true, color: "#ffe082" });
        reservations.forEach((r, i) => text(`${r.id} · ${r.table_id} · ${dn(r.dish_id)} · ${r.state || "scheduled"} · ${fmtTime(r.arrival_tick || 0)}`, w - 406, 144 + i * 32, { size: 18, color: "#f3ece1" }));
      }
      const items = phase === "gather" ? snap.hold : snap.stock;
      if (Array.isArray(items) && items.some((it) => itemFresh(it) !== null)) {
        const rows = items.map((it) => {
          const f = itemFresh(it);
          return {
            txt: `${it.id || ""} ${KIND_NAME[itemKind(it)] || itemKind(it)} ${f === null ? "" : f.toFixed(1) + "%" + (f < 30 ? " ƯƠN" : "")}`,
            col: f === null ? "#f3ece1" : f < 30 ? "#ff8a80" : f < 60 ? "#ffd54f" : "#a5f0b2"
          };
        });
        const height = 42 + rows.length * 26;
        const py = Math.max(150, h - height - 86);
        panel(12, py, 310, height, "rgba(10, 22, 34, 0.9)", "rgba(255, 214, 153, 0.35)");
        text("🌿 Độ tươi nguyên liệu", 24, py + 26, { size: 18, bold: true, color: "#ffe0b2" });
        rows.forEach((row, i) => text(row.txt, 24, py + 54 + i * 26, { size: 18, color: row.col }));
      }
    }

    // ----- Benchmark (TICKET-04): /?bench=1&duration=30&warmup=3 — đo từng khung bằng rAF, gửi về /bench -----
    const BENCH = (() => {
      const q = new URLSearchParams(location.search);
      return q.has("bench") ? { dur: +q.get("duration") || 30, warm: +q.get("warmup") || 3, t0: null, prev: null, deltas: [], done: false } : null;
    })();
    if (BENCH) menuOpen = false;
    function benchSend(o) { try { fetch("/bench", { method: "POST", body: JSON.stringify(o), headers: { "Content-Type": "application/json" } }); } catch (e) { /* bỏ qua */ } }
    function benchTick(now) {
      if (!BENCH || BENCH.done || !snap) return;
      if (BENCH.t0 === null) { BENCH.t0 = now; benchSend({ event: "first_frame" }); return; }
      const el = (now - BENCH.t0) / 1000;
      if (el < BENCH.warm) { BENCH.prev = now; return; }
      if (BENCH.prev !== null) BENCH.deltas.push(now - BENCH.prev);
      BENCH.prev = now;
      if (el >= BENCH.warm + BENCH.dur) { BENCH.done = true; benchSend({ event: "done", deltas: BENCH.deltas }); }
    }

    function frame() {
      requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
      benchTick(performance.now());
      const [w, h] = fit();
      ctx.fillStyle = highContrast ? "#000" : "#0c141c"; ctx.fillRect(0, 0, w, h);
      if (snap) {
        if (snap.phase === "shop") drawShop(w, h); else if (snap.phase === "quan" || snap.mode === "quan") drawQuan(w, h); else drawGather(w, h);
        drawPhase34(w, h);
        eventLog(w, h);
        overlay(w, h);
        screens(w, h);
      } else {
        text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 20, color: "#ffe0b2" });
      }
    }
    requestAnimationFrame(frame);
  </script>
</body>

</html>
